version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: converzia_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: converzia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d converzia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: converzia_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/converzia_db
      - USE_MOCK_DISPATCHER=True
      - ENVIRONMENT=development
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: .
    container_name: converzia_dashboard
    restart: always
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/converzia_db
    depends_on:
      - api

volumes:
  postgres_data:
